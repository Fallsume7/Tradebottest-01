[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mwbot"
version = "0.1.0"
description = "MarketWatchBot - virtual stock trading bot, scanner, simulator and backtester"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "apscheduler>=3.10,<4",
  "pandas>=2.2",
  "numpy>=1.26",
  "httpx>=0.27",
  "exchange_calendars>=4.5",
  "tzdata",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
ml = ["scikit-learn>=1.4"]  # optional gradient-boosted forecaster (never labelled validated without out-of-sample proof)
dev = [
  "pytest>=8",
  "ruff>=0.4",
  "mypy>=1.10",
  "pandas-stubs",
  "playwright>=1.44",
]

[project.scripts]
mwbot = "mwbot.cli:main"

[tool.setuptools.packages.find]
include = ["mwbot*"]

[tool.setuptools.package-data]
mwbot = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "browser: needs Playwright + Chromium (mock-site and dashboard E2E tests)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
