name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, unit + integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e "backend[dev]"
      - name: Ruff lint
        run: ruff check backend
      - name: Ruff format check
        run: ruff format --check backend
      - name: Mypy
        working-directory: backend
        run: mypy mwbot
      - name: Tests (no browser)
        working-directory: backend
        run: python -m pytest -m "not browser" -p no:warnings

  frontend:
    name: Frontend (types, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: frontend/dist
          retention-days: 7

  browser:
    name: Browser tests (mock trading site + dashboard E2E)
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: frontend/dist
      - name: Install
        run: |
          pip install -e "backend[dev]"
          playwright install --with-deps chromium
      - name: Browser tests
        working-directory: backend
        env:
          CI: "true"
        run: python -m pytest -m browser -p no:warnings

  windows:
    name: Windows smoke (backend, no browser)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "backend[dev]"
      - name: Tests (subset, no browser)
        working-directory: backend
        run: python -m pytest -m "not browser" -p no:warnings tests/test_calendar.py tests/test_orders_and_fills.py tests/test_broker.py tests/test_risk.py tests/test_scanner.py tests/test_strategies.py tests/test_data_providers.py tests/test_persistence.py tests/test_bot_sessions.py
